name: Sync API spec

# Keeps src/lib/api/openapi/swagger.yaml (vendored from openctemio/api@develop)
# and the generated wire types in sync automatically. Previously a manual dance:
# whenever api changed its OpenAPI spec, this repo's `check:spec-vendored` gate
# went red until someone re-vendored + regenerated by hand. This opens that PR
# for you.
#
# Auth: set repo secret API_SYNC_TOKEN to a PAT (or GitHub App token) with
#   - read access to openctemio/api (needed only if that repo is private), and
#   - contents:write + pull-requests:write on this repo,
# so the opened PR also triggers CI. Without it the job falls back to
# GITHUB_TOKEN (PR still opens, but CI won't auto-run on it).

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch: {}
  repository_dispatch:
    types: [api-spec-changed] # api can fire this on merge to develop

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-api-spec
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch upstream API spec
        env:
          API_TOKEN: ${{ secrets.API_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/openctemio/api/develop/api/openapi/swagger.yaml"
          AUTH=()
          [ -n "${API_TOKEN:-}" ] && AUTH=(-H "Authorization: Bearer ${API_TOKEN}")
          curl -fsSL "${AUTH[@]}" "$URL" -o src/lib/api/openapi/swagger.yaml
          echo "Fetched upstream swagger.yaml ($(wc -c < src/lib/api/openapi/swagger.yaml) bytes)"

      - name: Regenerate wire types
        run: bash scripts/generate-api-types.sh

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- src/lib/api/openapi/swagger.yaml src/lib/api/generated/api.types.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "API spec already in sync — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open / update sync PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.API_SYNC_TOKEN || github.token }}
          branch: chore/sync-api-spec
          base: develop
          commit-message: 'chore(api-types): sync vendored OpenAPI spec + regenerate wire types'
          title: 'chore(api-types): sync vendored OpenAPI spec from openctemio/api'
          body: |
            Automated sync — the OpenAPI spec in `openctemio/api@develop` changed.
            This re-vendors `src/lib/api/openapi/swagger.yaml` and regenerates
            `src/lib/api/generated/api.types.ts`. Review the type diff, then merge.

            Triggered by the `Sync API spec` workflow.
          delete-branch: true
          add-paths: |
            src/lib/api/openapi/swagger.yaml
            src/lib/api/generated/api.types.ts
